<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - EITC Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#003A5D',
                        secondary: '#1A1A1A',
                        accent: '#0BBF78',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50">
    <script>
        // Verificar que el usuario es admin antes de mostrar el panel
        function checkAdminAccess() {
            const authToken = localStorage.getItem('authToken');
            const currentUserStr = localStorage.getItem('currentUser');

            if (!authToken || !currentUserStr) {
                alert('Debes iniciar sesión primero');
                window.location.href = 'index.html';
                return false;
            }

            try {
                const currentUser = JSON.parse(currentUserStr);
                if (currentUser.role !== 'admin') {
                    alert('No tienes permiso para acceder al panel admin. Solo los administradores pueden entrar aquí.');
                    window.location.href = 'index.html';
                    return false;
                }
                return true;
            } catch (e) {
                alert('Error al verificar permisos');
                window.location.href = 'index.html';
                return false;
            }
        }

        // Ejecutar verificación cuando carga la página
        if (!checkAdminAccess()) {
            document.body.innerHTML = '<div class="flex items-center justify-center h-screen"><p class="text-gray-600">Redirigiendo...</p></div>';
        }
    </script>

    <!-- Navbar Admin -->
    <nav class="bg-primary text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-2">
                    <div class="w-8 h-8 bg-accent rounded-lg"></div>
                    <span class="font-bold text-xl">EITC Academy Admin</span>
                </div>
                <div class="flex space-x-4">
                    <span id="adminName" class="text-gray-200"></span>
                    <button onclick="logoutAdmin()" class="px-4 py-2 bg-red-600 rounded hover:bg-red-700 transition">Cerrar Sesión</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Tabs -->
        <div class="flex space-x-4 mb-8">
            <button onclick="switchTab('cursos')" id="tabCursos" class="px-4 py-2 bg-primary text-white rounded hover:bg-opacity-90 transition font-bold">
                Mis Cursos
            </button>
            <button onclick="switchTab('crear')" id="tabCrear" class="px-4 py-2 bg-gray-300 text-secondary rounded hover:bg-gray-400 transition font-bold">
                Crear Curso
            </button>
        </div>

        <!-- Tab: Listar Cursos -->
        <div id="tabCursosContent" class="space-y-6">
            <h2 class="text-3xl font-bold text-secondary mb-4">Mis Cursos</h2>
            
            <div id="misCursosContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Los cursos se cargarán aquí -->
            </div>
        </div>

        <!-- Tab: Crear/Editar Curso -->
        <div id="tabCrearContent" class="hidden space-y-6">
            <h2 class="text-3xl font-bold text-secondary mb-4" id="crearTitulo">Crear Nuevo Curso</h2>
            
            <form id="cursoForm" class="bg-white p-8 rounded-lg shadow space-y-6">
                <input type="hidden" id="cursoId">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-secondary mb-2">Nombre del Curso</label>
                        <input type="text" id="cursoNombre" placeholder="Ej: Termografía Infrarroja" class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:border-primary" required>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-secondary mb-2">Categoría</label>
                        <select id="cursoCategoria" class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:border-primary" required>
                            <option value="">Selecciona una categoría</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-secondary mb-2">Descripción</label>
                    <textarea id="cursoDescripcion" placeholder="Descripción detallada del curso..." class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:border-primary h-32" required></textarea>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-secondary mb-2">Precio (S/.)</label>
                        <input type="number" id="cursoPrecio" placeholder="199.99" step="0.01" class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:border-primary" required>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-secondary mb-2">Modalidad</label>
                        <select id="cursoModalidad" class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:border-primary" required>
                            <option value="virtual">Virtual</option>
                            <option value="presencial">Presencial</option>
                            <option value="hibrido">Híbrido</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-secondary mb-2">Nivel</label>
                        <select id="cursoNivel" class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:border-primary" required>
                            <option value="basico">Básico</option>
                            <option value="intermedio">Intermedio</option>
                            <option value="avanzado">Avanzado</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-secondary mb-2">Duración (horas)</label>
                        <input type="number" id="cursoDuracion" placeholder="40" class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:border-primary" required>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-secondary mb-2">Certificado</label>
                        <input type="text" id="cursoCertificado" placeholder="Ej: Certificación EITC - Nivel Intermedio" class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:border-primary">
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-secondary mb-2">Imagen del Curso</label>
                        <input type="file" id="cursoImagen" accept="image/*" class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:border-primary">
                        <p class="text-xs text-gray-600 mt-1">JPG, PNG o GIF (máx 5MB)</p>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-secondary mb-2">Syllabus</label>
                    <textarea id="cursoSyllabus" placeholder="1. Tema 1&#10;2. Tema 2&#10;3. Tema 3..." class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:border-primary h-32" required></textarea>
                </div>

                <div class="flex items-center space-x-4">
                    <input type="checkbox" id="cursoPublicado" class="w-4 h-4">
                    <label for="cursoPublicado" class="text-sm font-bold text-secondary">Publicar curso</label>
                </div>

                <div class="flex space-x-4">
                    <button type="submit" class="px-6 py-2 bg-accent text-secondary rounded font-bold hover:bg-opacity-90 transition">Guardar Curso</button>
                    <button type="button" onclick="limpiarFormulario()" class="px-6 py-2 bg-gray-300 text-secondary rounded font-bold hover:bg-gray-400 transition">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal de Edición Rápida -->
    <div id="editModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-8 max-w-md w-full">
            <h3 class="text-2xl font-bold text-secondary mb-6">Opciones del Curso</h3>
            <div class="space-y-4" id="modalOpciones">
                <!-- Botones dinámicos -->
            </div>
            <button onclick="closeEditModal()" class="mt-4 w-full text-gray-600 hover:text-secondary">Cerrar</button>
        </div>
    </div>

    <script src="/js/admin.js"></script>
</body>
</html>
