<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Admin - EITC Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                colors: {
                    primary: '#2563eb',
                    secondary: '#1e40af',
                    accent: '#dc2626',
                    white: '#ffffff',
                    gray: {
                        50: '#f9fafb',
                        100: '#f3f4f6',
                        200: '#e5e7eb',
                        300: '#d1d5db',
                        400: '#9ca3af',
                        500: '#6b7280',
                        600: '#4b5563',
                        700: '#374151',
                        800: '#1f2937',
                        900: '#111827'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body class="bg-gray-900">
    <div class="w-full max-w-md mx-auto p-4">
        <!-- Card -->
        <div class="bg-white rounded-lg shadow-xl p-8">
            <!-- Header -->
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-gray-800 mb-2">Registro Admin</h1>
                <p class="text-gray-600">Crear cuenta de administrador para EITC Academy</p>
            </div>

            <!-- Form -->
            <form id="adminRegisterForm" class="space-y-4">
                <!-- Name -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nombre completo</label>
                    <input type="text" id="adminName" placeholder="Tu nombre" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary focus:ring-opacity-20" required>
                </div>

                <!-- Email -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Correo electrónico</label>
                    <input type="email" id="adminEmail" placeholder="correo@example.com" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary focus:ring-opacity-20" required>
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                    <input type="password" id="adminPassword" placeholder="Mínimo 8 caracteres" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary focus:ring-opacity-20" required minlength="8">
                </div>

                <!-- Confirm Password -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Confirmar contraseña</label>
                    <input type="password" id="adminPasswordConfirm" placeholder="Confirmar contraseña" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary focus:ring-opacity-20" required minlength="8">
                </div>

                <!-- Admin Code (Secret) -->
                <div class="bg-blue-50 border border-blue-200 rounded-lg p-3 mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Código de administrador</label>
                    <input type="password" id="adminCode" placeholder="Ingresa el código secreto" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary focus:ring-opacity-20" required>
                    <p class="text-xs text-gray-600 mt-2">Se requiere código secreto para crear una cuenta admin. Pídelo al propietario del proyecto.</p>
                </div>

                <!-- Error Message -->
                <div id="adminErrorMessage" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm"></div>

                <!-- Success Message -->
                <div id="adminSuccessMessage" class="hidden bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-lg text-sm"></div>

                <!-- Submit Button -->
                <button type="submit" class="w-full bg-primary text-white font-bold py-2 rounded-lg hover:bg-secondary transition">
                    Registrarse como Admin
                </button>
            </form>

            <!-- Footer -->
            <div class="mt-6 text-center">
                <p class="text-gray-600 text-sm">
                    ¿Ya tienes cuenta?
                    <a href="index.html" class="text-primary font-bold hover:underline">Inicia sesión aquí</a>
                </p>
            </div>

            <!-- Back to Home -->
            <div class="mt-4 text-center">
                <a href="index.html" class="text-gray-600 hover:text-gray-800 text-sm">← Volver a inicio</a>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8000/api';
        const ADMIN_SECRET_CODE = 'EITC_ADMIN_2025'; // Código secreto (cambiar en producción)

        document.getElementById('adminRegisterForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('adminName').value.trim();
            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value;
            const passwordConfirm = document.getElementById('adminPasswordConfirm').value;
            const adminCode = document.getElementById('adminCode').value;

            // Clear messages
            document.getElementById('adminErrorMessage').classList.add('hidden');
            document.getElementById('adminSuccessMessage').classList.add('hidden');

            // Validations
            if (password !== passwordConfirm) {
                showError('Las contraseñas no coinciden');
                return;
            }

            if (password.length < 8) {
                showError('La contraseña debe tener mínimo 8 caracteres');
                return;
            }

            if (adminCode !== ADMIN_SECRET_CODE) {
                showError('Código de administrador incorrecto');
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        name,
                        email,
                        password,
                        password_confirmation: password,
                        role: 'admin' // Crear como admin
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showSuccess(`¡Bienvenido admin ${name}! Redirigiendo...`);
                    localStorage.setItem('authToken', data.data.token);
                    localStorage.setItem('currentUser', JSON.stringify(data.data.user));
                    
                    setTimeout(() => {
                        window.location.href = 'admin.html';
                    }, 1500);
                } else {
                    showError(data.message || 'Error en el registro');
                }
            } catch (error) {
                console.error('Error:', error);
                showError('Error de conexión. Intenta de nuevo.');
            }
        });

        function showError(message) {
            const errorEl = document.getElementById('adminErrorMessage');
            errorEl.textContent = message;
            errorEl.classList.remove('hidden');
        }

        function showSuccess(message) {
            const successEl = document.getElementById('adminSuccessMessage');
            successEl.textContent = message;
            successEl.classList.remove('hidden');
        }
    </script>
</body>
</html>
